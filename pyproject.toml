[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marketlens"
version = "0.1.0"
description = "Quantitative Financial Pipeline & Portfolio Optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "yfinance",
    "scipy",
    "matplotlib"
]

[tool.setuptools.packages.find]
where = ["src"]